(function(){
'use strict';
const $=id=>document.getElementById(id);
const VER=window.__GB_VER||'dev';
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.random()*a.length|0];
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

/* =========================================================
   設定：名、時間、幾多樣先識行／識跑、雞髀鍾意食嘅嘢
   ========================================================= */
const CFG={KID:'雞髀',MOM:'媽咪',DURATION:40,WALK_AT:10,RUN_AT:28,MIN_SCORE:300,MAX_SCORE:1500,RAIN_AT:10};
// 分數全部係 10 嘅倍數（0 字尾）；最後 10 秒落食物雨；結尾分數保底 300、封頂 1500
const FOODS=[
  {e:'🍎',n:'蘋果',c:'#ff4d4d'},{e:'🍌',n:'香蕉',c:'#ffd23f'},{e:'🍓',n:'士多啤梨',c:'#ff3d6e'},{e:'🍇',n:'提子',c:'#9b5de5'},
  {e:'🍉',n:'西瓜',c:'#ff5c7a'},{e:'🌽',n:'粟米',c:'#ffc93c'},{e:'🍠',n:'蕃薯',c:'#c8553d'},{e:'🧀',n:'芝士',c:'#ffcf3f'},
  {e:'🍪',n:'餅乾',c:'#c98a4b'},{e:'🍮',n:'布甸',c:'#f4a23c'},{e:'🍼',n:'奶奶',c:'#7ad3ff'},{e:'🍗',n:'雞髀',c:'#d9822b'},
  {e:'🍙',n:'飯糰',c:'#ffffff'},{e:'🥚',n:'蛋蛋',c:'#f3d6b0'},{e:'🍊',n:'橙',c:'#ff9f1c'}
];
const BONUS={e:'🎂',n:'生日蛋糕',c:'#ff8fb1'},GOLD={e:'🍗',n:'金雞髀',c:'#ffd23f'};
const DRUM=FOODS.find(f=>f.e==='🍗'),OTHER=FOODS.filter(f=>f!==DRUM),DRUM_RATE=.42;   // 雞髀最鍾意食雞髀：42% 係 🍗
function pickFood(){return Math.random()<DRUM_RATE?DRUM:pick(OTHER)}
const PTS={food:10,cake:50,gold:100,bomb:-50,poop:-30};   // 分數：好嘢、蛋糕、金光雞髀（最高分）、炸彈、屎
const HAZ={bomb:{e:'💣',n:'炸彈'},poop:{e:'💩',n:'屎'}};
const HAZ_RATE=[.24,.34,.44];                     // 每次跌嘢係扣分物品嘅機會（爬、行、跑）
const STAGES=[
  {name:'BB 爬爬',icon:'🍼',speed:4,  steer:7, cad:1.05,spawn:.6, z0:16},
  {name:'學行行', icon:'👣',speed:7.2,steer:10,cad:2.2,spawn:.5, z0:23},
  {name:'跑跑跑', icon:'💨',speed:12, steer:14,cad:3.4,spawn:.38,z0:31}
];

/* ---- 禁止雙指放大、雙擊放大、長按選單 ---- */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});

const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,musicBus=null,sfxBus=null,noiseBuf=null,muted=LS.get('gb-mute')==='1';
function silentWav(){const n=1600,buf=new ArrayBuffer(44+n),v=new DataView(buf),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++)v.setUint8(44+i,128);let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  return 'data:audio/wav;base64,'+btoa(s)}
function initAudio(){
  try{
    if(!ac&&AC){
      ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
      sfxBus=ac.createGain();sfxBus.gain.value=.9;sfxBus.connect(master);
      newMusicBus();
      noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
      try{const a=new Audio(silentWav());a.loop=true;a.play().catch(()=>{});window.__unlock=a}catch(e){}
    }
    if(ac&&ac.state==='suspended')ac.resume();
  }catch(e){}
}
function newMusicBus(){
  if(!ac)return;
  if(musicBus){const old=musicBus;try{old.gain.setTargetAtTime(0,ac.currentTime,.03)}catch(e){}setTimeout(()=>{try{old.disconnect()}catch(e){}},500)}
  musicBus=ac.createGain();musicBus.gain.value=.3;musicBus.connect(master);
}
function setMute(m){muted=m;LS.set('gb-mute',m?'1':'0');$('muteBtn').textContent=m?'🔇':'🔊';$('muteBtn2').textContent=$('muteBtn3').textContent=m?'🔇 冇聲':'🔊 有聲';
  if(ac&&master)master.gain.setTargetAtTime(m?0:1,ac.currentTime,.02)}
const now=()=>ac?ac.currentTime:0;
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,dur,o){
  if(!ac)return;o=o||{};
  const os=ac.createOscillator(),g=ac.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
  if(o.glide)os.frequency.exponentialRampToValueAtTime(o.glide,t+dur);
  const v=o.vol==null?.12:o.vol,a=Math.min(o.attack||.006,dur*.5);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let node=os;if(o.lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);node=fl}
  node.connect(g);g.connect(o.dest||sfxBus);os.start(t);os.stop(t+dur+.05);
}
function noiseHit(t,dur,o){
  if(!ac)return;o=o||{};
  const src=ac.createBufferSource();src.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type=o.ftype||'bandpass';f.frequency.setValueAtTime(o.freq||2000,t);
  if(o.freqTo)f.frequency.exponentialRampToValueAtTime(o.freqTo,t+dur);f.Q.value=o.q||1;
  const g=ac.createGain(),v=o.vol||.1;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(o.attack||.005,dur*.5));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(o.dest||sfxBus);src.start(t,Math.random()*.4);src.stop(t+dur+.05);
}
const SFX={
  chomp(c){const t=now(),up=Math.min(c,8)*45;tone(360+up,t,.07,{type:'square',vol:.045,glide:190+up,lp:2200});
    noiseHit(t+.01,.05,{ftype:'lowpass',freq:1500,vol:.12});tone(640+up*1.4,t+.07,.1,{type:'triangle',vol:.07})},
  bonus(){const t=now();[84,88,91,96].forEach((m,i)=>tone(mf(m),t+.05+i*.06,.4,{vol:.09}))},
  levelup(){const t=now();[72,76,79,84,88].forEach((m,i)=>{tone(mf(m),t+i*.08,.32,{type:'triangle',vol:.14});tone(mf(m+12),t+i*.08,.2,{vol:.04})});
    tone(mf(91),t+.42,1,{type:'triangle',vol:.12});tone(220,t+.4,.4,{vol:.12,glide:880})},
  count(go){tone(go?mf(84):mf(76),now(),go?.5:.18,{type:'square',vol:.055,lp:3000})},
  tick(){tone(mf(88),now(),.06,{type:'square',vol:.035,lp:4000})},
  whistle(){const t=now();tone(mf(93),t,.16,{type:'square',vol:.045,lp:4500});tone(mf(93),t+.2,.55,{type:'square',vol:.045,lp:4500})},
  boing(){tone(190,now(),.38,{vol:.16,glide:760})},
  whoosh(){noiseHit(now(),.6,{freq:350,freqTo:3200,q:1.2,vol:.16,attack:.18})},
  hug(){const t=now();[60,64,67,72,76].forEach((m,i)=>tone(mf(m),t+i*.06,1.6,{type:'triangle',vol:.07}))},
  cheer(){const t=now();for(let i=0;i<55;i++)noiseHit(t+Math.random()*1.6,.04+Math.random()*.04,{freq:1500+Math.random()*2500,q:2,vol:.03+Math.random()*.05})},
  pop(){tone(700,now(),.09,{vol:.08,glide:1300})},
  boom(){const t=now();noiseHit(t,.7,{ftype:'lowpass',freq:1200,freqTo:90,vol:.7,attack:.004});tone(130,t,.55,{vol:.55,glide:32});
    tone(mf(67),t+.25,.16,{type:'triangle',vol:.08});tone(mf(62),t+.42,.32,{type:'triangle',vol:.08})},
  splat(){const t=now();noiseHit(t,.2,{ftype:'lowpass',freq:520,vol:.45});tone(320,t+.02,.4,{type:'sawtooth',vol:.06,glide:80,lp:700});
    tone(mf(64),t+.3,.14,{type:'triangle',vol:.07});tone(mf(60),t+.45,.3,{type:'triangle',vol:.07})},
  count1(){tone(mf(96),now(),.03,{type:'square',vol:.018,lp:5000})}
};
/* ---- 背景音樂：原創旋律，階段越高越快、越多樂器 ---- */
const CH=[[48,60,64,67],[45,57,60,64],[41,57,60,65],[43,55,59,62]];
const MEL=[[72,0,76,79,81,79,76,0],[72,0,76,0,74,72,69,0],[69,72,77,0,76,74,72,74],[79,0,74,0,76,0,74,0],
           [76,79,84,0,83,81,79,76],[81,0,79,76,77,0,76,74],[74,77,81,77,79,77,76,74],[74,0,71,0,72,0,0,0]];
const BPM=[100,116,138];
const Music={on:false,stage:0,step:0,next:0,timer:0,
  start(){if(!ac)return;this.on=true;this.step=0;this.next=ac.currentTime+.08;if(!this.timer)this.timer=setInterval(()=>this.tick(),25)},
  stop(){this.on=false},
  tick(){if(!this.on||!ac||ac.state!=='running')return;const sd=60/(BPM[this.stage]*(this.boost||1))/2;
    if(this.next<ac.currentTime-.2)this.next=ac.currentTime+.05;
    while(this.next<ac.currentTime+.15){this.play(this.step,this.next,sd);this.step=(this.step+1)%64;this.next+=sd}},
  play(s,t,sd){const bar=s>>3,i=s&7,ch=CH[bar%4],st=this.stage,d=musicBus;
    const m=MEL[bar][i];
    if(m){tone(mf(m),t,sd*1.7,{type:st===0?'sine':'triangle',vol:st===0?.16:.13,dest:d});tone(mf(m+12),t,sd*.8,{vol:.03,dest:d})}
    if(i===0||(st>0&&i===4)||(st===2&&(i&1)===0))tone(mf(ch[0]-12),t,sd*(st===2?1.1:1.9),{vol:.2,dest:d});
    if(st===0&&(i&1))tone(mf(ch[1+((i>>1)%3)]+12),t,sd*1.4,{vol:.045,dest:d});
    if(st>=1&&(i===2||i===6))ch.slice(1).forEach(n=>tone(mf(n),t,sd*.7,{type:'triangle',vol:.035,dest:d}));
    if(st>=1&&(i===0||i===4))tone(140,t,.22,{vol:.42,glide:45,dest:d});
    if(st===2){noiseHit(t,.035,{ftype:'highpass',freq:7000,vol:.06,dest:d});if(i===2||i===6)noiseHit(t,.13,{freq:1800,q:.7,vol:.14,dest:d})}
  }
};
function birthdaySong(){

    [79,1,48],[76,1],[72,1],[71,1,41],[69,1.6],[77,.6],[77,.25],[76,1,48],[72,1],[74,1,43],[72,3,48]];
  const b=.47,d=musicBus;let t=now()+.25;

    if(bass){tone(mf(bass-12),t,b*2.6,{vol:.17,dest:d});[4,7].forEach(iv=>tone(mf(bass+iv),t+b,b*.8,{type:'triangle',vol:.03,dest:d}))}

const glowCache={};
function glowSpr(ch,col){
  col=col||'#ff1e1e';const key=ch+col;if(glowCache[key])return glowCache[key];
  const base=spr(ch),pad=20,sil=document.createElement('canvas');sil.width=base.width;sil.height=base.height;
  const sg=sil.getContext('2d');sg.drawImage(base,0,0);sg.globalCompositeOperation='source-in';sg.fillStyle=col;sg.fillRect(0,0,sil.width,sil.height);
  const c=document.createElement('canvas');c.width=c.height=base.width+pad*2;const g=c.getContext('2d');
  g.shadowColor=col;g.shadowBlur=12;
  for(let i=0;i<16;i++){const a=i/16*TAU;g.drawImage(sil,pad+Math.cos(a)*8,pad+Math.sin(a)*8)}
  return glowCache[key]=c;
}
function spr(ch){
  if(sprCache[ch])return sprCache[ch];
  const px=112,c=document.createElement('canvas');c.width=c.height=Math.round(px*1.25);
  const g=c.getContext('2d');g.textAlign='center';g.textBaseline='middle';g.font=px+'px '+EMOJI_FONT;g.fillText(ch,c.width/2,c.height/2+px*.06);
  return sprCache[ch]=c;
}

const splats=[],SPLAT_SPR=[0,1,2].map(makeSplat);
function makeSplat(seed){
  const c=document.createElement('canvas');c.width=c.height=240;const g=c.getContext('2d'),R=(a,b)=>a+Math.random()*(b-a);
  g.translate(120,110);
  const blob=(r,n,col,j)=>{g.beginPath();for(let i=0;i<=n;i++){const a=i/n*TAU,rr=r*(1+R(-j,j));const x=Math.cos(a)*rr,y=Math.sin(a)*rr*.9;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.fillStyle=col;g.fill()};
  blob(62,16,'#5a3412',.22);
  for(let i=0;i<3;i++){const x=R(-40,40),w=R(8,14),h=R(30,70);g.fillStyle='#5a3412';g.beginPath();g.moveTo(x-w/2,20);g.lineTo(x+w/2,20);g.lineTo(x+w/2,20+h);g.arc(x,20+h,w/2,0,Math.PI);g.closePath();g.fill()}
  for(let i=0;i<8;i++){const a=R(0,TAU),d=R(68,100);g.beginPath();g.arc(Math.cos(a)*d,Math.sin(a)*d*.9,R(5,13),0,TAU);g.fillStyle='#5a3412';g.fill()}
  blob(46,12,'#7b4a1d',.2);blob(26,10,'#93602e',.25);
  g.fillStyle='rgba(255,235,200,.35)';g.beginPath();g.ellipse(-16,-20,14,7,-.5,0,TAU);g.fill();
  return c;
}

function expectScore(t){const t0=CFG.DURATION-CFG.RAIN_AT;return t<=t0?t*14:t0*14+(t-t0)*26}

let cuRaf=0;
function countUp(target,rec,elId,recId){
  const el=$(elId||'endScore'),t0=performance.now(),dur=1500;let shown=-1,lastTick=0;cancelAnimationFrame(cuRaf);
  const step=t=>{const e=Math.min(1,(t-t0)/dur),v=Math.round(target*(1-Math.pow(1-e,3))/10)*10;   // 跳嘅時候都係 0 字尾
    if(v!==shown){shown=v;el.textContent=v;if(t-lastTick>70){lastTick=t;SFX.count1()}}
    if(e<1)cuRaf=requestAnimationFrame(step);else if(rec&&target>0){$(recId||'newRec').classList.remove('hidden');SFX.bonus()}};

/* ---- 每格更新 ---- */
function update(dt){
  T+=dt;
  for(const c of clouds){c.x+=c.v*dt;if(c.x>W+40)c.x=-cloudSpr.width*c.s-20}
  for(const b of skyBal){b.y-=b.v*dt;if(b.y<-.15){b.y=1.05;b.x=rand(.1,.9)}}
  // 世界前進速度
  let v=0;
  if(state==='attract')v=2.4;
  else if(state==='play')v=STAGES[p.stage].speed*(mode==='endless'?1+.3*endDiff():mode==='tutorial'?.8:1);
  else if(state==='finale'){
    if(fin.phase>=2)v=0;
    else if(mom)v=Math.min(STAGES[2].speed,Math.max(1.5,(mom.z-MOM_STOP)*1.2));
    else v=STAGES[2].speed;
  }
  if(state==='finale'&&mom)speed=v;else speed+=(v-speed)*Math.min(1,dt*2.5);
  const dz=speed*dt;
  for(const d of decos)d.z-=dz;
  for(const f of flags)f.z-=dz;
  if(mom)mom.z-=dz;
  prune(decos,d=>d.z>-3.5);prune(flags,f=>f.z>-2);
  decoNext-=dz;while(decoNext<ZFAR){spawnDeco(decoNext);decoNext+=rand(1.1,2.2)}
  flagNext-=dz;while(flagNext<ZFAR){if(!fin)flags.push({z:flagNext,type:flagType});flagType^=1;flagNext+=rand(24,32)}

  if(state==='countdown')updCountdown(dt);
  else if(state==='play')updPlay(dt);
  else if(state==='attract')updAttract(dt);
  else if(state==='finale')updFinale(dt);
  else if(state==='over')updOver(dt);

  updatePlayer(dt);
  updateFoods(dt);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.life-=dt;if(q.vr)q.rot+=q.vr*dt}
  prune(parts,q=>q.life>0);
  for(const q of pops)q.t+=dt;prune(pops,q=>q.t<q.dur);
  for(const c of confetti){c.y+=c.vy*dt;c.x+=(c.vx+Math.sin(T*2.4+c.sw)*36)*dt;c.rot+=c.vr*dt}
  prune(confetti,c=>c.y<H+30);
  if(flashA>0)flashA=Math.max(0,flashA-dt*1.6);
  if(shake>0)shake=Math.max(0,shake-dt);
  camX+=(p.x*.35-camX)*Math.min(1,dt*3);
  updateHUD();
}
function updCountdown(dt){
  cd.t+=dt;if(cd.t>1.5)p.face=Math.max(0,1-(cd.t-1.5)/.4);const marks=[0,.8,1.6,2.4];
  while(cd.i<4&&cd.t>=marks[cd.i]){const i=cd.i++;if(i<3){banner(String(3-i));SFX.count(false)}else{banner('出發！');SFX.count(true);beginPlay()}}
}
function updPlay(dt){
  if(mode==='tutorial'){updTut(dt);return}
  if(mode==='endless'){updEndless(dt);return}
  tGame+=dt;timeLeft-=dt;const st=STAGES[p.stage];
  if(timeLeft>1){
    if(!rain&&timeLeft<=CFG.RAIN_AT){rain=true;rainT=0;banner('最後 10 秒！食物雨！🍗');SFX.whistle();Music.boost=1.15;flashA=.3;flashRed=false}
    if(rain){rainT-=dt;if(rainT<=0){const d=dda();rainT=clamp(.12*(1+.6*d),.08,.22);const pr=clamp(.45+.25*d,.25,.7),z=rand(22,40);   // 食物雨：慢慢飄落、好密
      if(Math.random()<pr)spawnFood(Math.random()<.4?p.x+rand(-1,1):rand(-XLIM,XLIM),z,'poop',rand(12,18));
      else{const r=Math.random();spawnFood(rand(-XLIM,XLIM),z,r<.006?'gold':r<.03,rand(12,18))}}}
    else{spawnT-=dt;if(spawnT<=0){spawnWave();spawnT=st.spawn*rand(.85,1.2)*(1+.25*dda())}}
    bonusT-=dt;if(bonusT<=0){spawnFood(rand(-2,2),st.z0+rand(-2,2),true);bonusT=dda()<-.3?rand(6,9):rand(9,13)}
    goldT-=dt;if(goldT<=0){let x=0;for(let i=0;i<8;i++){x=rand(-XLIM,XLIM);if(Math.abs(x-p.x)>1.5)break}spawnFood(x,st.z0+rand(0,5),'gold');goldT=rand(11,15)}   // 金雞髀：少、喺遠處，要拖先食到
  }
  const sec=Math.ceil(timeLeft);if(sec<=5&&sec>=1&&sec!==lastTick){lastTick=sec;SFX.tick()}
  if(hintOn&&(dragDist>40||tGame>7))hintOn=false;
  if(timeLeft<=0){timeLeft=0;startFinale()}
}
/* ---------------- 無限模式：冇時間限制，3 條命，中炸彈扣一條，越玩越難 ---------------- */
function endDiff(){return mode==='endless'?Math.min(1,tGame/90):0}
function updEndless(dt){
  tGame+=dt;const st=STAGES[p.stage],df=endDiff();
  spawnT-=dt;if(spawnT<=0){spawnWave();spawnT=st.spawn*rand(.85,1.2)*(1-.3*df)}
  bonusT-=dt;if(bonusT<=0){spawnFood(rand(-2,2),st.z0+rand(-2,2),true);bonusT=rand(9,13)}
  goldT-=dt;if(goldT<=0){let x=0;for(let i=0;i<8;i++){x=rand(-XLIM,XLIM);if(Math.abs(x-p.x)>1.5)break}spawnFood(x,st.z0+rand(0,5),'gold');goldT=rand(11,15)}
  if(hintOn&&(dragDist>40||tGame>7))hintOn=false;
}
function loseLife(){
  lives=Math.max(0,lives-1);hudDirty=true;const el=$('lives');el.classList.remove('hurt');void el.offsetWidth;el.classList.add('hurt');
  if(lives<=0)gameOver();else banner('💔');
}
function gameOver(){
  state='over';overT=0;drag=null;hintOn=false;p.yuck=0;Music.stop();hudHide();banner('💥');
  const t=now();[67,63,60].forEach((m,i)=>tone(mf(m),t+.3+i*.28,.3,{type:'triangle',vol:.12}));tone(mf(55),t+1.14,.8,{type:'triangle',vol:.12});
}
function updOver(dt){
  overT+=dt;p.face=Math.min(1,overT/.5);
  if(overT>1.6&&$('over').classList.contains('hidden')){
    const rec=score>bestEndless;if(rec){bestEndless=score;LS.set('gb-best-endless',String(score))}

    $('overScore').textContent='0';$('over').classList.remove('hidden');$('muteBtn').classList.remove('hidden');countUp(score,rec,'overScore','overRec');
  }

/* ---------------- 新手教學：玩一次學識（唔用文字，用手勢、箭咀、✅❌） ----------------
   0 拖去右邊食 🍗 → 1 左邊三樣 → 2 金光雞髀 → 3 屎示範（鎖住雞髀，畀屎跌中）→ 4 避屎
   → 5 炸彈示範 → 6 避炸彈 → 7 食物雨，食到長大識跑 → 8 完成 */
const TUT_STEPS=9,TUT_WALK=8,TUT_RUN=16;
function tutStart(){tut.step=0;tutSetup()}
function tutDrop(kind){const z=p.z+STAGES[p.stage].speed*.8*1.15+.5;spawnFood(p.x,z,kind);const f=foods[foods.length-1];f.tut=1;tut.items=[f]}
function tutSetup(){
  const s=tut.step;tut.t=0;tut.wait=0;tut.items=[];tut.lock=false;tut.hand=null;hudDirty=true;tut.hits=s<=4?poops:bombs;
  const add=(x,z,k)=>{spawnFood(x,z,k);const f=foods[foods.length-1];f.tut=1;tut.items.push(f)};
  if(s===0){add(1.8,13);tut.hand={to:1.8}}
  else if(s===1){for(let i=0;i<3;i++)add(-1.8,13+i*2.4);tut.hand={to:-1.8}}
  else if(s===2){add(1.6,14,'gold');tut.hand={to:1.6}}
  else if(s===3){tut.lock=true;tut.wait=.6}
  else if(s===4){add(p.x,15,'poop');tut.hand={dodge:1}}
  else if(s===5){tut.lock=true;tut.wait=.6}
  else if(s===6){add(p.x,15,'bomb');tut.hand={dodge:1}}
  else if(s===7){tut.rainT=0}
  else if(s===8){banner('🎉');SFX.levelup();for(let i=0;i<90;i++)confetti.push(newConf(true));tut.wait=2.4}
}
function tutNext(ok){banner(ok?'✅':'❌');if(ok)SFX.bonus();tut.step++;tut.pause=1.1}
function updTut(dt){
  tGame+=dt;tut.t+=dt;
  if(tut.pause>0){tut.pause-=dt;if(tut.pause<=0)tutSetup();return}
  const s=tut.step,gone=f=>f.st!==2&&(f.a<=0||f.z<p.z-1.2||!foods.includes(f));
  if(s<=2){
    if(tut.items.some(f=>f.st===2)&&(s!==1||tut.items.filter(f=>f.st===2).length>=2)){tutNext(true);return}
    if(tut.items.every(f=>f.st===2||gone(f))){banner('🔁');tutSetup()}
  }else if(s===3||s===5){
    if(tut.wait>0){tut.wait-=dt;if(tut.wait<=0)tutDrop(s===3?'poop':'bomb');return}
    if((s===3?poops:bombs)>tut.hits){tut.hits=s===3?poops:bombs;banner('❌');tut.step++;tut.pause=1.6}
    else if(tut.items[0]&&gone(tut.items[0])){tut.items=[];tut.wait=.3}
  }else if(s===4||s===6){
    const f=tut.items[0];if(!f)return;
    if(f.a<=0&&f.st!==2&&(s===4?poops:bombs)>tut.hits){tut.hits=s===4?poops:bombs;banner('🔁');tut.pause=1.4;return}
    if(f.z<p.z-1.2){tutNext(true)}
  }else if(s===7){
    tut.rainT-=dt;if(tut.rainT<=0){tut.rainT=.16;spawnFood(Math.random()<.5?p.x+rand(-1,1):rand(-XLIM,XLIM),rand(14,24),false,rand(14,20))}

/* =========================================================
   角色：2.5D 骨架動畫（設計單位：100 ＝ 1 米，再乘 CHAR）
   雞髀：黑色冬菇頭、黑色 34 號波衫同短褲、黑襪；媽咪：粉紅裙、皇冠

const LINE='#3d2a22';
const SKIN='#ffd7b5',SKIN_HI='rgba(255,245,235,.6)',SKIN_SH='#eab48f';
const HAIR='#121216';
const JER='#17191e',CREAM='#efe3c4',GREEN='#1f6b3a',BLUE='#2a6fd6',SOCK='#141518',SOCK_SOLE='#353842';
const M_SKIN='#ffdcc6',M_HAIR='#2e1d18',DRESS='#ff86ad',DRESS_D='#e2588a',DRESS_HI='#ffc6d9',M_SHOE='#e64b7a';
function circO(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2.6;ctx.strokeStyle=LINE;ctx.stroke()}
function ellO(x,y,rx,ry,col,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2.6;ctx.strokeStyle=LINE;ctx.stroke()}
function rrPath(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function rrO(x,y,w,h,r,col){rrPath(x,y,w,h,r);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2.6;ctx.strokeStyle=LINE;ctx.stroke()}
/* 兩頭唔同粗嘅膠囊（手腳）：a 端半徑 ra、b 端半徑 rb */
function capPath(ax,ay,bx,by,ra,rb){
  const dx=bx-ax,dy=by-ay,d=Math.max(.001,Math.hypot(dx,dy)),a=Math.atan2(dy,dx),off=Math.asin(clamp((ra-rb)/d,-1,1));
  ctx.beginPath();ctx.arc(ax,ay,ra,a+Math.PI/2-off,a+Math.PI*1.5+off);ctx.arc(bx,by,rb,a-Math.PI/2+off,a+Math.PI/2-off);ctx.closePath();
}
/* 一條手或者腳（兩節）：先畫外框，再填色，再加高光 */
function limb2(ax,ay,bx,by,cx,cy,ra,rb,rc,col,hi){
  ctx.fillStyle=LINE;capPath(ax,ay,bx,by,ra+2.4,rb+2.4);ctx.fill();capPath(bx,by,cx,cy,rb+2.4,rc+2.4);ctx.fill();
  ctx.fillStyle=col;capPath(ax,ay,bx,by,ra,rb);ctx.fill();capPath(bx,by,cx,cy,rb,rc);ctx.fill();
  if(hi){ctx.fillStyle=hi;hiStrip(ax,ay,bx,by,ra,rb);hiStrip(bx,by,cx,cy,rb,rc)}
}
function hiStrip(ax,ay,bx,by,ra,rb){
  const dx=bx-ax,dy=by-ay,d=Math.max(.001,Math.hypot(dx,dy));let nx=-dy/d,ny=dx/d;if(nx*-.6+ny*-.8<0){nx=-nx;ny=-ny}
  capPath(ax+nx*ra*.42,ay+ny*ra*.42,bx+nx*rb*.42,by+ny*rb*.42,ra*.3,rb*.3);ctx.fill();
}
function star4(x,y,r,col){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.35:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle=col;ctx.fill()}

/* ---------------- 雞髀動作：3D 關節（x 右、y 高、z 向前），再投影去畫面 ----------------
   鏡頭喺雞髀後面上面望落嚟，所以向前（z）嘅嘢喺畫面會高啲（KZ），遠嘅嘢細少少（PERSP）；
   爬嗰陣個身打橫向前，投影出嚟先有立體感；左右行時成個人會轉向嗰邊（yaw） */
const J3=['p','n','h','e0','a0','k0','f0','e1','a1','k1','f1'];
const SK=['hr','sw','hw','tw','hb','pr','s0','s1','hem','rot'];
const KZ=.82,PERSP=420;
function blendPose(a,b,t){const o={};for(const j of J3)for(const c of 'xyz'){const key=j+c;o[key]=a[key]+(b[key]-a[key])*t}for(const key of SK)o[key]=a[key]+(b[key]-a[key])*t;return o}
function baseStand(up){return{px:0,py:40+up*.6,pz:0,nx:0,ny:86+up,nz:0,hx:0,hy:117+up,hz:0,hr:34,sw:21,hw:10,tw:1,hb:0,pr:0,s0:0,s1:0,hem:0,rot:0,
  e0x:-26,e0y:64+up,e0z:0,a0x:-28,a0y:46+up,a0z:0,e1x:26,e1y:64+up,e1z:0,a1x:28,a1y:46+up,a1z:0,
  k0x:-11,k0y:20,k0z:0,f0x:-12,f0y:0,f0z:0,k1x:11,k1y:20,k1z:0,f1x:12,f1y:0,f1z:0}}
function P_idle(t){const o=baseStand(Math.sin(t*2.2)*1.3);o.hem=Math.sin(t*2.2)*.5;return o}
function P_wave(t){const o=P_idle(t),w=Math.sin(t*9);o.e1x=33;o.e1y=98;o.a1x=38+w*7;o.a1y=118-Math.abs(w)*2;o.hx=w*1.5;o.rot=-.03;return o}
function P_walk(ph){
  const c=Math.sin(ph),up=Math.abs(Math.cos(ph))*4,sw=c*5,o=baseStand(up);
  o.px=sw*.8;o.nx=sw;o.hx=sw*1.12;o.hz=2;o.rot=c*.05;o.pr=c*.05;o.hem=c*2;
  for(const i of [0,1]){const sd=i?1:-1,lift=Math.max(0,sd*c);
    o['k'+i+'x']=sd*12+sw*.5;o['k'+i+'y']=20+lift*5+up*.5;o['k'+i+'z']=sd*c*4;
    o['f'+i+'x']=sd*13+sw*.3;o['f'+i+'y']=lift*12;o['f'+i+'z']=sd*c*7;
    o['e'+i+'x']=sd*33+sw;o['e'+i+'y']=74+up;o['e'+i+'z']=-sd*c*5;
    o['a'+i+'x']=sd*41+sw;o['a'+i+'y']=63+up-sd*c*6;o['a'+i+'z']=-sd*c*8}
  return o;
}
function P_run(ph){
  const c=Math.sin(ph),up=Math.abs(Math.cos(ph))*9,sw=c*2.5,o=baseStand(up);
  o.py=42+up;o.ny=82+up;o.nz=4;o.hy=111+up;o.hz=8;o.px=sw*.6;o.nx=sw;o.hx=sw*1.1;o.rot=c*.03;o.pr=c*.06;o.hem=c*3+Math.abs(c)*2;
  for(const i of [0,1]){const sd=i?1:-1,lift=Math.max(0,sd*c),fwd=Math.max(0,-sd*c),s2=sd*c;
    o['k'+i+'x']=sd*12+sw*.4;o['k'+i+'y']=22+lift*3+up*.4;o['k'+i+'z']=fwd*9-lift*3;
    o['f'+i+'x']=sd*12+sw*.3;o['f'+i+'y']=lift*32;o['f'+i+'z']=fwd*10-lift*8;o['s'+i]=lift;
    o['e'+i+'x']=sd*30+sw;o['e'+i+'y']=66+up+s2*8;o['e'+i+'z']=s2*8;
    o['a'+i+'x']=sd*25+sw;o['a'+i+'y']=52+up+s2*20;o['a'+i+'z']=s2*12}
  return o;
}
/* 爬：個身打橫（頸喺盤骨前面 34），對角手腳一齊郁（左手同右膝頭），
   手提起向前再按落地，膝頭向前拖，腳板底向住鏡頭；屁股擰、個身左右搖 */
function P_crawl(ph){
  // 2026-11-10 第七版：Bill 話「要似真爬緊：隻手要垂直向下，手掌向地、指尖向前，膊頭要同屁屁一樣高」
  // → 背脊打平（膊頭高度 ＝ 屁股高度 30），雙手由膊頭垂直落地、手掌貼地；膝頭喺屁股下面、腳板向後
  //   對角手腳輪流：手提起少少向前一步再按落地（手臂差唔多保持直）；重心慢慢左右移、頭望前面點一點
  const s=Math.sin(ph),dip=(1-Math.cos(ph*2))/2,o=baseStand(0),SH=31,SZ=40;
  Object.assign(o,{px:s*3,py:SH+dip,pz:0,nx:s*4,ny:SH-dip*1.5,nz:SZ,hx:s*5,hy:SH+11-dip*2,hz:SZ+17,
    hr:30,sw:19,hw:11,tw:.95,hb:1,pr:s*.12,rot:s*.06,hem:s*2});
  for(const i of [0,1]){const sd=i?1:-1,th=ph+(i?Math.PI:0),tk=th+Math.PI,lift=Math.max(0,Math.cos(th)),kl=Math.max(0,Math.cos(tk)),
    hx=sd*24+s*4,hz=SZ+2+7*Math.sin(th),hy=5*lift;
    o['a'+i+'x']=hx;o['a'+i+'y']=hy;o['a'+i+'z']=hz;                                   // 手掌：喺膊頭正下面、貼地
    o['e'+i+'x']=(o.nx+sd*(o.sw-2)+hx)/2+sd*lift*3;o['e'+i+'y']=(o.ny+hy)/2+lift*2;o['e'+i+'z']=(SZ+hz)/2;   // 手肘喺中間，差唔多直
    o['k'+i+'x']=sd*13;o['k'+i+'y']=2*kl;o['k'+i+'z']=4+5*Math.sin(tk);              // 膝頭喺屁股下面
    o['f'+i+'x']=sd*10;o['f'+i+'y']=6+1.5*kl;o['f'+i+'z']=-18+4*Math.sin(tk);o['s'+i]=1}
  return o;
}
/* 抱：雙手攬住媽咪膊頭（雞髀喺媽咪左邊少少，所以左右手位置唔同），雙腳喺半空踢 */
function P_hug(t){
  const o=baseStand(Math.sin(t*2.5)*1.5);o.hem=Math.sin(t*3)*2;
  o.e0x=-36;o.e0y=96;o.e0z=6;o.a0x=-32;o.a0y=120+Math.sin(t*4)*1.5;o.a0z=12;
  o.e1x=38;o.e1y=94;o.e1z=6;o.a1x=42;o.a1y=118+Math.sin(t*4+1)*1.5;o.a1z=12;
  for(const i of [0,1]){const sd=i?1:-1;o['k'+i+'x']=sd*13;o['k'+i+'y']=22;o['f'+i+'x']=sd*15;o['f'+i+'y']=2-Math.sin(t*7+sd*1.5)*9}
  return o;
}
/* 3D → 畫面（設計單位）；d* 係前後次序（大＝遠，先畫） */
function project(o,yaw){
  const c=Math.cos(yaw),s=Math.sin(yaw),r={},dz={};
  for(const j of J3){let x=o[j+'x'],z=o[j+'z'];if(yaw){const x0=x-o.px;x=o.px+x0*c+z*s;z=-x0*s+z*c}
    r[j+'x']=x/(1+z/PERSP);r[j+'y']=-(o[j+'y']+z*KZ);dz[j]=z}
  for(const key of SK)r[key]=o[key];
  const cw=Math.abs(c)*.7+.3;r.hr=o.hr/(1+dz.h/PERSP);r.sw=o.sw*cw;r.hw=o.hw*cw;
  r.dHead=dz.h-6;r.dTorso=(dz.n+dz.p)/2;r.dShorts=dz.p+2;
  for(const i of [0,1]){r['dArm'+i]=(dz['e'+i]+dz['a'+i])/2-4;r['dLeg'+i]=(dz.p+dz['k'+i])/2+4}
  return r;
}
const anim={mode:'crawl',from:null,t:1,dur:.3,pose:null,pose3:null};
function setMode(m,dur){if(anim.mode===m)return;anim.from=anim.pose3;anim.mode=m;anim.t=anim.from?0:1;anim.dur=dur||.3}
function targetPose(){
  switch(anim.mode){case 'walk':return P_walk(p.ph);case 'run':return P_run(p.ph);case 'wave':return P_wave(T);
    case 'idle':return P_idle(T);case 'hug':return P_hug(T);default:return P_crawl(p.ph)}
}
function updAnim(dt){
  let o=targetPose();
  if(p.yuck>0&&anim.mode!=='crawl'){o.e1x=o.nx+22;o.e1y=o.ny+6;o.e1z=8;o.a1x=o.hx+9;o.a1y=o.hy-16;o.a1z=12}
  if(p.chomp>0){const c=Math.sin(p.chomp/.25*Math.PI);o.hy-=c*4;o.hz+=c*4;o.hr*=1+c*.06}
  if(anim.t<1&&anim.from){anim.t=Math.min(1,anim.t+dt/anim.dur);o=blendPose(anim.from,o,ease(anim.t))}
  anim.pose3=o;anim.pose=project(o,anim.mode==='hug'||p.face>0?0:p.yaw+(anim.mode==='crawl'?Math.sin(p.ph)*.13:0));
}

function kidLeg(o,i){

    if(sp&&tut.hand){const sz=46,cyc=(T*.8)%1;let x0=sp.x,x1;
      if(tut.hand.dodge){const f=tut.items[0];const dir=f&&f.x>p.x?-1:1;x1=sp.x+dir*W*.28}else{const q=proj(tut.hand.to,0,p.z);x1=q?q.x:sp.x}
      const e=ease(Math.min(1,cyc/.75)),hx=lerp(x0,x1,e),hy=sp.y+18;ctx.globalAlpha=cyc>.85?(1-cyc)/.15:1;
      ctx.strokeStyle='rgba(255,92,138,.55)';ctx.lineWidth=6;ctx.lineCap='round';ctx.setLineDash([2,12]);ctx.beginPath();ctx.moveTo(x0,hy+10);ctx.lineTo(hx,hy+10);ctx.stroke();ctx.setLineDash([]);
      ctx.drawImage(spr('👆'),hx-sz*.4,hy,sz*1.25,sz*1.25);ctx.globalAlpha=1}
    if(sp&&tut.lock){const sz=34;ctx.globalAlpha=.9;ctx.drawImage(spr('👀'),sp.x-sz*.62,sp.y-sp.s*CHAR*1.6-sz,sz*1.25,sz*1.25);ctx.globalAlpha=1}
  }
  for(const c of confetti){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.scale(1,Math.cos(T*5+c.sw));ctx.fillStyle=c.col;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore()}
  drawSplats(paused?0:renderDt);
  if(flashA>0){ctx.fillStyle=(flashRed?'rgba(255,70,70,':'rgba(255,255,255,')+flashA+')';ctx.fillRect(0,0,W,H)}
}

/* =========================================================
   HUD
   ========================================================= */
const elRunner=$('runner'),elFill=$('trackFill'),elTime=$('timeTxt'),elGoal=$('goal');
let hudProg=-1,hudSec=-1;
function hudShow(){const h=$('hud');h.dataset.mode=mode;h.classList.remove('hidden','fade');$('muteBtn').classList.add('hidden');hudDirty=true;hudProg=-1;hudSec=-1}
function hudHide(){$('hud').classList.add('fade')}
function updateHUD(){
  if(state!=='play'&&state!=='countdown')return;
  if(mode!=='birthday'){
    if(mode==='endless'){const sec=Math.floor(tGame);if(sec!==hudSec){hudSec=sec;elTime.textContent=sec;elTime.classList.remove('warn')}}
    if(hudDirty){hudDirty=false;$('scoreChip').textContent='⭐ '+score+' 分';$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
      if(mode==='tutorial')$('stageChip').textContent='🎓 '+'●'.repeat(Math.min(tut.step,TUT_STEPS-1))+'○'.repeat(Math.max(0,TUT_STEPS-1-tut.step));
      else{const st=STAGES[p.stage];$('stageChip').textContent=st.icon+' '+st.name;let f,t;
        if(p.stage===0){f=eaten/CFG.WALK_AT;t='再食 '+(CFG.WALK_AT-eaten)+' 樣就識行！'}
        else if(p.stage===1){f=(eaten-CFG.WALK_AT)/(CFG.RUN_AT-CFG.WALK_AT);t='再食 '+Math.max(0,CFG.RUN_AT-eaten)+' 樣就識跑！'}
        else{f=1;t='跑跑跑！衝呀～ 💨'}
        $('evoFill').style.width=(clamp(f,0,1)*100)+'%';$('evoTxt').textContent=t}}
    return;
  }
  const prog=clamp(1-timeLeft/CFG.DURATION,0,1);
  if(Math.abs(prog-hudProg)>.002){hudProg=prog;elRunner.style.left='calc((100% - 6px) * '+prog.toFixed(4)+')';elFill.style.width=(prog*100).toFixed(2)+'%'}
  const sec=Math.max(0,Math.ceil(timeLeft));
  if(sec!==hudSec){hudSec=sec;elTime.textContent=sec;elTime.classList.toggle('warn',sec<=10);elGoal.classList.toggle('call',sec<=10)}
  if(hudDirty){hudDirty=false;const st=STAGES[p.stage];$('stageChip').textContent=st.icon+' '+st.name;$('scoreChip').textContent='⭐ '+score+' 分';
    let f,t;
    if(p.stage===0){f=eaten/CFG.WALK_AT;t='再食 '+(CFG.WALK_AT-eaten)+' 樣就識行！'}
    else if(p.stage===1){f=(eaten-CFG.WALK_AT)/(CFG.RUN_AT-CFG.WALK_AT);t='再食 '+Math.max(0,CFG.RUN_AT-eaten)+' 樣就識跑！'}
    else{f=1;t='跑跑跑！衝呀～ 💨'}
    $('evoFill').style.width=(clamp(f,0,1)*100)+'%';$('evoTxt').textContent=t}
}

/* =========================================================
   手指拖動（Pointer Events）
   ========================================================= */
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'||paused||(mode==='tutorial'&&tut.lock))return;e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const sp=proj(p.tx,0,p.tz);if(!sp)return;
  drag={id:e.pointerId,fx:e.clientX,fy:e.clientY,sx:sp.x,sy:sp.y,cam:camX};
});
cv.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id||state!=='play')return;e.preventDefault();
  const dx=e.clientX-drag.fx,dy=e.clientY-drag.fy;dragDist=Math.max(dragDist,Math.hypot(dx,dy));
  const sy=Math.max(drag.sy+dy*1.1,horizonY+20);
  const z=clamp(camH*k*D/(sy-horizonY)-D,ZMIN,ZMAX),s=sAt(z);
  p.tx=clamp((drag.sx+dx*1.1-W/2)/s+drag.cam,-XLIM,XLIM);p.tz=z;
});
const endDrag=e=>{if(drag&&e.pointerId===drag.id)drag=null};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

/* =========================================================
   相片（縮細先存，WEB-09）
   ========================================================= */
let photoKey='kid';
const KID_DEFAULT='kid-face.jpg';
function setPhotoUI(){
  $('slotKid').querySelector('.x').style.visibility=LS.get('gb-photo-kid')?'visible':'hidden';
  for(const [key,slot,end,hud,emo] of [['kid','slotKid','endKid','runner','👶'],['mom','slotMom','endMom','goal','👩']]){
    const img=photos[key],url=img?'url('+img.src+')':'';
    $(slot).classList.toggle('has',!!img);$(slot).querySelector('.pic').style.backgroundImage=url;
    $(end).style.backgroundImage=url;$(end).classList.toggle('photo',!!img);
    $(hud).style.backgroundImage=url;$(hud).classList.toggle('photo',!!img);if(!img)$(hud).textContent=emo;
  }
}
function loadPhoto(key,du){if(!du){photos[key]=null;setPhotoUI();return}const img=new Image();img.onload=()=>{photos[key]=img;setPhotoUI()};img.onerror=()=>{if(du!==KID_DEFAULT)LS.del('gb-photo-'+key)};img.src=du}
function handleFile(file){
  const key=photoKey,url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const S=320,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
    const w=img.naturalWidth,h=img.naturalHeight,m=Math.min(w,h),sx=(w-m)/2,sy=h>w?(h-m)*.3:0;
    g.drawImage(img,sx,sy,m,m,0,0,S,S);URL.revokeObjectURL(url);
    const du=c.toDataURL('image/jpeg',.82);
    if(!LS.set('gb-photo-'+key,du))toast('部機存唔到相，不過今次照用');
    loadPhoto(key,du);SFX.pop();if(camAlbum){camAlbum=false;closeCam(true)}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast('呢張相開唔到，試第二張')};
  img.src=url;
}
$('slotKid').addEventListener('click',e=>{
  if(e.target.classList.contains('x')){LS.del('gb-photo-kid');loadPhoto('kid',KID_DEFAULT);return}
  photoKey='kid';$('fileIn').value='';$('fileIn').click();
});
$('slotMom').addEventListener('click',e=>{
  if(e.target.classList.contains('x')){photos.mom=null;LS.del('gb-photo-mom');setPhotoUI();return}
  openCam(null);
});
/* ---- 即時影媽咪：前鏡頭、圓圈對準塊面，只存圓圈入面 ---- */
let camStream=null,camFacing='user',camThen=null,camShotData=null,camAlbum=false;
async function openCam(then){camThen=then;camShotData=null;$('camScr').classList.remove('hidden');camLive();await camStart()}
async function camStart(){
  camStop();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camFail();return}
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:camFacing,width:{ideal:960},height:{ideal:960}},audio:false});
    const v=$('camVid');v.srcObject=camStream;v.classList.toggle('mirror',camFacing==='user');await v.play().catch(()=>{});
    $('camTip').textContent='將塊面放入圓圈，笑一笑 😊';
  }catch(e){camFail()}
}
function camFail(){$('camTip').textContent='開唔到相機（要撳「允許」），或者撳「用相簿」揀相'}
function camStop(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
function camLive(){$('camShot').classList.add('hidden');$('camVid').classList.remove('hidden');$('camRow1').classList.remove('hidden');$('camRow2').classList.add('hidden')}
function camSnap(){
  const v=$('camVid'),vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh){toast('相機未準備好，等一陣再撳');return}
  initAudio();noiseHit(now(),.08,{ftype:'highpass',freq:3000,vol:.3});tone(1800,now()+.05,.05,{type:'square',vol:.03});
  const m=Math.min(vw,vh),sx=(vw-m)/2,sy=(vh-m)/2,mir=camFacing==='user';
  const shot=$('camShot'),g=shot.getContext('2d');g.save();if(mir){g.translate(480,0);g.scale(-1,1)}g.drawImage(v,sx,sy,m,m,0,0,480,480);g.restore();
  const S=320,c=document.createElement('canvas');c.width=c.height=S;const g2=c.getContext('2d');
  g2.save();if(mir){g2.translate(S,0);g2.scale(-1,1)}g2.drawImage(v,sx+m*.12,sy+m*.12,m*.76,m*.76,0,0,S,S);g2.restore();
  camShotData=c.toDataURL('image/jpeg',.86);
  shot.classList.remove('hidden');v.classList.add('hidden');$('camRow1').classList.add('hidden');$('camRow2').classList.remove('hidden');
  const f=$('camFlash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
}
function closeCam(go){camStop();$('camScr').classList.add('hidden');const t=camThen;camThen=null;if(go&&t)t()}
$('snapBtn').addEventListener('click',camSnap);
$('retakeBtn').addEventListener('click',()=>{camLive()});
$('useBtn').addEventListener('click',()=>{if(!camShotData)return;if(!LS.set('gb-photo-mom',camShotData))toast('部機存唔到相，不過今次照用');loadPhoto('mom',camShotData);closeCam(true)});
$('flipBtn').addEventListener('click',()=>{camFacing=camFacing==='user'?'environment':'user';camLive();camStart()});
$('camAlbumBtn').addEventListener('click',()=>{camAlbum=true;photoKey='mom';$('fileIn').value='';$('fileIn').click()});
$('camSkipBtn').addEventListener('click',()=>closeCam(true));
$('fileIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)handleFile(f)});

/* =========================================================
   掣、背景、螢幕唔熄、自動更新
   ========================================================= */
$('startBtn').addEventListener('click',()=>{mode='birthday';if(photos.mom)startGame();else{initAudio();openCam(startGame)}});
$('tutBtn').addEventListener('click',()=>{mode='tutorial';startGame()});
$('endlessBtn').addEventListener('click',()=>{mode='endless';startGame()});
$('overAgain').addEventListener('click',()=>{initAudio();SFX.pop();restart()});
$('overHome').addEventListener('click',()=>{SFX.pop();goHome()});
$('tdBirthday').addEventListener('click',()=>{mode='birthday';$('tutDone').classList.add('hidden');if(photos.mom){initAudio();restart()}else{initAudio();openCam(()=>restart())}});
$('tdEndless').addEventListener('click',()=>{mode='endless';$('tutDone').classList.add('hidden');initAudio();restart()});
$('tdAgain').addEventListener('click',()=>{mode='tutorial';$('tutDone').classList.add('hidden');initAudio();restart()});
$('tdHome').addEventListener('click',()=>{$('tutDone').classList.add('hidden');goHome()});
$('pauseBtn').addEventListener('pointerdown',e=>{e.stopPropagation();pauseGame()});
$('resumeBtn').addEventListener('click',resumeGame);
$('homeBtn').addEventListener('click',goHome);
$('againBtn').addEventListener('click',()=>{initAudio();SFX.pop();restart()});
$('songBtn').addEventListener('click',()=>{initAudio();birthdaySong();if(fin){const c=hugPoint();for(let i=0;i<10;i++)heart(c.x,c.y,true)}});
$('muteBtn').addEventListener('click',()=>{initAudio();setMute(!muted)});
$('muteBtn2').addEventListener('click',()=>setMute(!muted));
$('muteBtn3').addEventListener('click',()=>{initAudio();setMute(!muted);if(!muted)SFX.pop()});
let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible'&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){wl=null}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pauseGame();try{if(ac)ac.suspend()}catch(e){}if(camStream){camStop();camLive()}}
  else{fixViewport();if(!paused){try{if(ac)ac.resume()}catch(e){}}if(state!=='attract')keepAwake();checkUpdate();if(!$('camScr').classList.contains('hidden')&&!camShotData)camStart()}
});
window.addEventListener('resize',fixViewport);
window.addEventListener('orientationchange',()=>setTimeout(fixViewport,300));
window.addEventListener('pageshow',fixViewport);
function checkUpdate(){
  if(state!=='attract'||location.protocol==='file:')return;
  try{if(Date.now()-(+sessionStorage.getItem('gb-reload')||0)<120000)return}catch(e){}
  fetch(location.pathname+'?vcheck='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(txt=>{
    const m=txt.match(new RegExp("__GB"+"_VER='([0-9A-Za-z-]+)'"));
    if(!m||m[1]===VER||state!=='attract')return;
    try{sessionStorage.setItem('gb-reload',String(Date.now()))}catch(e){}
    location.replace(location.pathname+'?v='+m[1]);
  }).catch(()=>{});
}
function showBest(){const a=[];if(bestScore>0)a.push('🎂 最高分 '+bestScore);if(bestEndless>0)a.push('♾️ 最高分 '+bestEndless);$('bestTxt').textContent=a.length?'🏆 '+a.join(' · '):''}

/* ---- 開始 ---- */
let lastT=0,renderDt=0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt=(ts-lastT)/1000;lastT=ts;if(!(dt>0))dt=.016;dt=Math.min(dt,.05);
  renderDt=dt;if(!paused){distW+=speed*dt;update(dt)}
  render();
}
fixViewport();[60,250,600,1200].forEach(ms=>setTimeout(fixViewport,ms));
$('verTxt').textContent='v'+VER;setMute(muted);showBest();
loadPhoto('kid',LS.get('gb-photo-kid')||KID_DEFAULT);loadPhoto('mom',LS.get('gb-photo-mom')||'');
setPhotoUI();
requestAnimationFrame(frame);
setTimeout(checkUpdate,1500);
if(/[?&]test\b/.test(location.search))window.__gbTest={
  get s(){return{state,mode,lives,tut:tut.step,eaten,score,bombs,poops,stage:p.stage,timeLeft,phase:fin&&fin.phase,foods:foods.length,parts:parts.length,mom:mom&&mom.z,zoom,endShown}},
  start(m){if(m)mode=m;startGame()},sheet(v){sheetMode=v},auto(v){autoPilot=v},drop(k){p.tx=p.x;p.tz=p.z;spawnFood(p.x,p.z+STAGES[p.stage].speed*1.15+.5,k)},setTime(v){timeLeft=v},setEaten(v){eaten=v;checkEvolve();hudDirty=true}
};
})();
